version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zeus
      POSTGRES_PASSWORD: zeus
      POSTGRES_DB: zeus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://zeus:zeus@postgres:5432/zeus
      USE_SQLITE_FALLBACK: ${USE_SQLITE_FALLBACK:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      SECRET_KEY: ${SECRET_KEY:-zeus-dev-secret-change-me}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
volumes:
  pgdata:
